version: 1.4.0
purpose: 项目初始化时由 Codex 在服务器生成的内部安全值；不得向用户重复索取
secrets:
  CAPTCHA_HMAC_SECRET:
    required: true
    generate: cryptographically secure random, at least 32 bytes
    use: 验证码答案 HMAC 和目标指纹派生子密钥
    rotate: 仅按项目安全计划；轮换时允许旧 challenge 自然过期
  SESSION_SIGNING_SECRET:
    required_when: 技术方案使用签名 Token 或签名会话
    generate: cryptographically secure random, at least 32 bytes
    use: Access/Refresh Token 或会话签名
  CSRF_SECRET:
    required_when: 管理后台框架需要独立 CSRF 密钥
    generate: cryptographically secure random, at least 32 bytes
  WITHDRAWAL_ENCRYPTION_KEY:
    required_when: withdrawal.resolved_enabled == true
    generate: cryptographically secure random, at least 32 bytes
    use: 提现实名姓名与收款账号快照的带认证加密
    rotate: 需要版本化密文和受控重加密；不得直接替换导致历史订单不可解密
rules:
  - 仅写入服务器受限运行配置和私有项目包
  - 不进入 Android、管理后台前端、H5 静态资源或公开仓库
  - 不在日志、报告和普通对话中打印完整值
  - 同一项目跨版本稳定保留，不得每次构建随机变化
  - 提现数据加密密钥必须与支付宝应用私钥分离，禁止复用证书私钥加密数据库字段
