apis:
- id: API-AUTH-001
  name: 注册
  method: POST
  path: /api/v1/auth/register
  captcha: new_ticket_required_for_REGISTER_SUBMIT
  idempotency: required
  rate_limit: register
  dependencies:
  - email when email verification is used
- id: API-AUTH-002
  name: 密码登录
  method: POST
  path: /api/v1/auth/login/password
  captcha: new_ticket_required_for_LOGIN_PASSWORD
  rate_limit: login
- id: API-AUTH-003
  name: 发送登录/注册/找回验证码
  method: POST
  path: /api/v1/auth/verification-codes
  captcha: new_ticket_required_for_SEND_VERIFICATION_CODE
  rate_limit: verification_code
- id: API-AUTH-004
  name: 验证码登录
  method: POST
  path: /api/v1/auth/login/code
  captcha: new_ticket_required_for_LOGIN_CODE
  rate_limit: login
- id: API-AUTH-005
  name: 请求找回密码
  method: POST
  path: /api/v1/auth/password-recovery
  captcha: new_ticket_required_for_PASSWORD_RECOVERY_REQUEST
  rate_limit: password_recovery
- id: API-AUTH-006
  name: 重置密码
  method: POST
  path: /api/v1/auth/password-reset
  captcha: new_ticket_required_for_PASSWORD_RESET_SUBMIT
  rate_limit: password_recovery
  reset_token: one_time
- id: API-AUTH-007
  name: 刷新会话
  method: POST
  path: /api/v1/auth/refresh
  captcha: not_required
  rate_limit: session
  refresh_token_rotation: true
- id: API-AUTH-008
  name: 退出当前设备
  method: POST
  path: /api/v1/auth/logout
  auth: required
- id: API-AUTH-009
  name: 退出全部设备
  method: POST
  path: /api/v1/auth/logout-all
  auth: required
  high_risk_confirmation: true
- id: API-AUTH-010
  name: 读取当前用户
  method: GET
  path: /api/v1/me
  auth: required
- id: API-AUTH-011
  name: 修改密码
  method: POST
  path: /api/v1/me/password
  auth: required
  high_risk_confirmation: true
  revoke_other_sessions: project_config
- id: API-AUTH-012
  name: 读取设备会话
  method: GET
  path: /api/v1/me/sessions
  auth: required
- id: API-AUTH-013
  name: 撤销指定设备会话
  method: DELETE
  path: /api/v1/me/sessions/{session_id}
  auth: required
  object_authorization: current_user_owns_session
- id: API-AUTH-014
  name: 申请账号注销
  method: POST
  path: /api/v1/me/deletion-requests
  auth: required
  required_when: account deletion enabled
  high_risk_confirmation: true
response_contract: 06_轻量平台基线全局规则/01_标准API与错误码/标准API响应与错误码规范.md
captcha_contract: 06_轻量平台基线全局规则/08_自研图形安全验证码与防刷/CAPTCHA_API_CONTRACT.yaml
