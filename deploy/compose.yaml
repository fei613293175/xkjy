name: xkjy-p00

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    env_file: ${XKJY_RUNTIME_ENV_FILE:?Set a protected server-only runtime env file}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build: {context: .., dockerfile: backend/Dockerfile}
    env_file: ${XKJY_RUNTIME_ENV_FILE:?Set a protected server-only runtime env file}
    environment: {MIGRATION_DIR: /app/migrations}
    entrypoint: ["/app/xkjy-migrate"]
    depends_on: {postgres: {condition: service_healthy}}
    restart: "no"

  backend:
    build: {context: .., dockerfile: backend/Dockerfile}
    restart: unless-stopped
    env_file: ${XKJY_RUNTIME_ENV_FILE:?Set a protected server-only runtime env file}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "/app/xkjy-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6

  admin:
    build: {context: .., dockerfile: admin-web/Dockerfile}
    restart: unless-stopped
    ports: ["127.0.0.1:18080:80"]
    depends_on: {backend: {condition: service_healthy}}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  postgres-data:
  redis-data:
