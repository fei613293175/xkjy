server {
    listen 80;
    server_name
        xkjy-api.orbexa.cc
        xkjy-admin.orbexa.cc
        xkjy-h5.orbexa.cc
        xkjy-yq.orbexa.cc
        xkjy-download.orbexa.cc
        xkjy-assets.orbexa.cc;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /www/server/nginx/html;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name xkjy-api.orbexa.cc;
    server_tokens off;

    ssl_certificate /www/server/panel/vhost/cert/xkjy.orbexa.cc_ecc/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/xkjy.orbexa.cc_ecc/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location = /healthz {
        proxy_pass http://127.0.0.1:18089;
        include /www/server/panel/vhost/nginx/xkjy-proxy-params.inc;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:18089;
        include /www/server/panel/vhost/nginx/xkjy-proxy-params.inc;
    }

    location / {
        return 404;
    }
}

server {
    listen 443 ssl;
    server_name xkjy-admin.orbexa.cc;
    server_tokens off;

    ssl_certificate /www/server/panel/vhost/cert/xkjy.orbexa.cc_ecc/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/xkjy.orbexa.cc_ecc/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    auth_basic "XKJY Admin";
    auth_basic_user_file /www/server/nginx/conf/auth/xkjy-admin.htpasswd;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    location / {
        proxy_pass http://127.0.0.1:18089;
        include /www/server/panel/vhost/nginx/xkjy-proxy-params.inc;
        proxy_set_header Authorization "";
    }
}

